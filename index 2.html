<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1f1e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="DAYFRAME">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><title>DAYFRAME</title>
<style>
:root{--am:#e3a867;--bg:#1b1f1e;--card:rgba(42,41,38,.78);--c2:#383631;--tx:#ece7dd;--mu:#a09d93;--ac:#5fb3a1;--wr:#d6a35c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#1b1f1e}body::before{content:'';position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(27,31,30,.6),rgba(27,31,30,.92)),url(hero.jpg) center/cover}body{margin:0;background:transparent;color:var(--tx);font:16px/1.4 -apple-system,system-ui,sans-serif;padding-top:env(safe-area-inset-top)}
#app{padding:16px 16px 110px;max-width:560px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(21,25,24,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.08);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;padding:15px 0;background:none;border:0;color:var(--mu);font-weight:600;font-size:11px;letter-spacing:.06em}
nav button.on{color:var(--ac)}
.card{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.05);border-radius:18px;padding:14px;margin:0 0 12px}
h1{font-size:26px;margin:4px 0 12px;font-weight:650}h2{font-size:14px;color:var(--mu);margin:20px 0 8px;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}a{color:var(--ac)}
.b{background:var(--ac);color:#10201c;border:0;border-radius:12px;padding:12px 16px;font-weight:600;min-height:46px}
.g{background:var(--c2);color:var(--tx)}.w{width:100%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input,select,textarea{width:100%;background:#1f2321;border:1px solid #3d403a;border-radius:10px;padding:11px;margin:4px 0 12px}
input[type=range]{padding:0;accent-color:var(--ac)}textarea{min-height:90px}
label{font-size:13px;color:var(--mu)}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #3a3833}
.row.done .t{opacity:.45;text-decoration:line-through}.row.now{border-left:3px solid var(--ac);padding-left:9px}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--ac);flex:none;background:none}.done .chk{background:var(--ac)}
.bar{height:8px;background:#3d403a;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--am))}.hero{margin:-16px -16px 18px;padding:0 20px 22px;min-height:250px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(rgba(27,31,30,0) 35%,#1b1f1e),url(hero.jpg) center 80%/cover}.hero h1{font-size:32px;margin:2px 0 4px;text-shadow:0 1px 12px rgba(0,0,0,.45)}.wm{font-weight:700;font-size:13px;letter-spacing:.2em;color:var(--am)}.sub{font-size:14px;color:#ddd6c8}
#sheet{display:none;position:fixed;inset:0;background:var(--bg);overflow:auto;padding:calc(16px + env(safe-area-inset-top)) 16px 60px;z-index:9}
#sheet.open{display:block}#sheet>div{max-width:560px;margin:auto}
.mu{color:var(--mu);font-size:13px}.pills{display:flex;gap:6px;overflow:auto;margin-bottom:12px}
.pills button{flex:none;padding:10px 14px;border-radius:20px;border:0;background:var(--c2);color:var(--mu);font-weight:600}.pills .on{background:var(--ac);color:#10201c}
.sp{display:flex;justify-content:space-between;align-items:center;gap:8px}details summary{padding:10px 0;font-weight:600}
</style></head><body><div id="app"></div><nav id="nav"></nav><div id="sheet"></div>
<script>
const K='dayframe.v1',$=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),tod=()=>ds(new Date()),pd=s=>{const[a,b,c]=s.split('-');return new Date(+a,b-1,+c)},uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),nm=()=>{const n=new Date();return pad(n.getHours())+':'+pad(n.getMinutes())},t12=s=>{let[h,m]=s.split(':');h=+h;return(h%12||12)+':'+m+(h<12?' AM':' PM')},mon=s=>{const d=pd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ds(d)},avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
const mk=a=>a.map((x,i)=>({id:'b'+i,s:x[0],e:x[1],t:x[2]}));
const wkd=(g,ev,pm)=>mk([['05:45','06:00','Wake up: water, make bed, morning check-in'],['06:00','07:00',g],['07:00','07:30','Shower, breakfast, protein'],['07:30','07:50','Spanish practice'],['07:50','08:00','Prepare workstation'],['08:00','17:00','Remote work: lunch away from desk, 10–15 min walk, movement breaks'],['17:00','17:30','Close laptop, transition out of work'],['17:30','19:00',ev],['19:00','19:30','Dinner, food prep, cleanup'],['19:30','21:00',pm],['21:00','21:30','Wind down: prep clothes and meals, no stimulating scrolling'],['21:30','23:59','Sleep']]);
const SCHED={1:wkd('Gym: Upper A','Skateboarding','AA or EA meeting'),2:wkd('Gym: Lower A','Daz Cartel music creation','Shopify research and business development'),3:wkd('Mobility, walking, recovery (optional extra sleep)','Skateboarding or Spanish conversation','AA or EA meeting'),4:wkd('Gym: Upper B','Music production','Investing and financial learning'),5:wkd('Gym: Lower B','Family, friends, social','Optional recovery meeting. No business assignment'),6:mk([['08:00','09:00','Breakfast'],['09:00','17:00','Family adventure day: kids first (parks, swimming, museums, Busch Gardens)'],['17:30','19:00','Dinner'],['21:00','21:30','Wind down'],['21:30','23:59','Sleep']]),0:mk([['08:00','10:00','Family breakfast and connection'],['10:00','14:00','Family activities, groceries, meal prep'],['14:00','17:00','Weekly financial review, Shopify, optional music'],['17:00','19:00','Optional recovery meeting, prepare for Monday'],['21:00','21:30','Wind down'],['21:30','23:59','Sleep']])};
const WT={'Upper A':['Bench press','Barbell or cable row','Overhead press','Lat pulldown','Biceps curl','Triceps pushdown'],'Lower A':['Back squat','Romanian deadlift','Leg press','Leg curl','Hip thrust','Calf raise'],'Upper B':['Pull-up or assisted pull-up','Incline dumbbell press','Seated dumbbell press','Chest-supported row','Lateral raise','Hammer curl'],'Lower B':['Trap-bar deadlift','Walking lunge','Split squat','Hamstring curl','Back extension','Plank or cable crunch']};
const MEALS=[['Breakfast','Eggs, oatmeal, banana, peanut butter, milk'],['Snack 1','Greek yogurt, granola, berries'],['Lunch','Chicken, rice, vegetables, olive oil'],['Snack 2','Protein smoothie, banana, milk, peanut butter'],['Dinner','Ground beef, potatoes, vegetables']];
const rec=n=>({n,f:[['Personal reflection only. DAYFRAME contains no official program text. Enter quotations only if you have verified them in your own copy of the literature.','i'],['Source','s'],['Book or literature title','s'],['Edition','s'],['Chapter or page reference','s'],['Verified quotation or reference (typed by you)','t'],['Personal interpretation','t'],['Practical action','t']]});
const TP={free:{n:'Free writing',f:[['Write','t']]},morning:{n:'Morning check-in',f:[['Current emotions','t'],['Emotional intensity (0–10)','n'],['Main thought or trigger','t'],['Physical sensations','t'],['What do I need today?','t'],['Alcohol craving intensity (0–10)','n'],['One manageable action','t'],['Today’s intention','t']]},evening:{n:'Evening reflection',f:[['What went well?','t'],['What was difficult?','t'],['What emotions appeared?','t'],['Did I protect my sobriety?','t'],['Did I connect with my children or other people?','t'],['What can I release?','t'],['Tomorrow’s first step','t']]},ea:rec('EA recovery reflection'),aa:rec('AA recovery reflection'),gratitude:{n:'Gratitude',f:[['What am I grateful for today?','t']]},craving:{n:'Trigger and craving log',f:[['Trigger','t'],['Environment','t'],['Emotion','t'],['Craving intensity (0–10)','n'],['Body sensations','t'],['What happened next?','t'],['Who did I contact?','t'],['Current craving intensity (0–10)','n']]},weekly:{n:'Weekly review',f:[['What went well?','t'],['What was difficult?','t'],['What did I learn?','t'],['What needs adjustment?','t'],['Next week’s priorities','t']]},father:{n:'Fatherhood memory',f:[['Child','s'],['Activity','s'],['What happened?','t'],['What I want to remember','t']]},music:{n:'Music idea (Daz Cartel)',f:[['Song title','s'],['Lyrics','t'],['Melody ideas','t'],['Production notes','t'],['Mood and genre','s'],['Next step','s']]},biz:{n:'Business note',f:[['Idea or project','s'],['Product research','t'],['Target customers','t'],['Competitors','t'],['Startup costs and revenue assumptions (yours, not estimates)','t'],['Next validation step','s']]},fin:{n:'Financial note',f:[['Lesson learned','t'],['Questions','t'],['Concept or research notes','t'],['Personal goal','s']]}};
const LT={spanish:'Spanish practice',music:'Music session',skate:'Skateboarding',meeting:'Recovery meeting (AA/EA)',family:'Family activity',biz:'Business session',invest:'Investing education',walk:'Walk or other activity'};
const DEF=()=>({set:{name:'DAYFRAME',wt:185,pmin:150,pmax:185,water:8,start:tod()},sched:JSON.parse(JSON.stringify(SCHED)),tpl:JSON.parse(JSON.stringify(WT)),days:{},logs:[],wk:[],journal:[],wts:[],contacts:[],grocery:''});
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}S=Object.assign(DEF(),S||{});
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('Could not save. Storage may be full or blocked in private browsing.')}};
const day=(d=tod())=>S.days[d]||(S.days[d]={done:{},kids:false,ow:false,intent:'',ess:['','',''],ed:[0,0,0],water:0,prot:0,kcal:0,meals:{}});
const blocks=dw=>(S.sched[dw]||[]).slice().sort((a,b)=>a.s<b.s?-1:1);
const CR='<div class="card" style="border:1px solid var(--wr)"><b>In danger or thinking about harming yourself?</b><br>Call or text <a href="tel:988">988</a> (US Suicide and Crisis Lifeline) or call <a href="tel:911">911</a>. SAMHSA helpline: <a href="tel:18006624357">1-800-662-4357</a>. DAYFRAME is a personal tool, not a clinician, therapist or sponsor.</div>';
let tab='today',cur=null,ent=null,wtpl=null,sd=new Date().getDay(),jq='',jf='',V={},A={};
const hd=t=>`<button class="b g" onclick="A.close()">‹ Back</button><h1 style="margin-top:14px">${t}</h1>`;
const op=fn=>{cur=fn;const s=$('#sheet');s.innerHTML='<div>'+fn()+'</div>';s.classList.add('open');s.scrollTop=0},rs=()=>{if(!cur)return;const s=$('#sheet'),y=s.scrollTop;s.innerHTML='<div>'+cur()+'</div>';s.scrollTop=y};
const render=()=>{$('#app').innerHTML=V[tab]();$('#nav').innerHTML=[['today','TODAY'],['schedule','SCHEDULE'],['journal','JOURNAL'],['progress','PROGRESS'],['library','LIBRARY']].map(t=>`<button class="${t[0]==tab?'on':''}" onclick="A.tab('${t[0]}')">${t[1]}</button>`).join('');document.title=S.set.name};
A.tab=t=>{tab=t;render();scrollTo(0,0)};A.close=()=>{cur=null;$('#sheet').classList.remove('open');render()};

V.today=()=>{const d=day(),n=nm(),bl=blocks(new Date().getDay()),opt=b=>d.kids&&b.s>='17:30'&&b.s<'21:00',core=bl.filter(b=>!opt(b)),dn=core.filter(b=>d.done[b.id]).length,pct=d.ow?Math.round(d.ed.filter(Boolean).length/3*100):core.length?Math.round(dn/core.length*100):0,nx=bl.find(b=>!d.done[b.id]&&b.e>n),h=new Date().getHours();
const E=['Protect sobriety and personal safety','One necessary responsibility','One restorative activity'];
const QA=[['Start workout','A.wo()'],['Log food','A.fd()'],['Write journal entry',"A.jn('free')"],['Emotional check-in',"A.jn('morning')"],['Log craving','A.cr()'],['Add activity',"A.add('spanish')"],['Attend meeting',"A.add('meeting')"],['Weekly progress',"A.tab('progress')"]];
return `<div class=hero><div class=wm>${esc(S.set.name)}</div><h1>${h<12?'Good morning':h<18?'Good afternoon':'Good evening'}</h1><div class=sub>${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})} · Build a life you enjoy living.</div></div>
<div class=card><div class=sp><b>Today’s completion</b><b style="font-size:30px;color:var(--am)">${pct}%</b></div><div class=bar style="margin:8px 0"><i style="width:${pct}%"></i></div>
${d.ow?'<div class=mu>Overwhelmed mode: three essentials are enough today.</div>':nx?`<div class=mu>${nx.s<=n?'Now':'Next'}: ${t12(nx.s)}–${t12(nx.e)}</div><div style="font-size:18px;font-weight:600">${esc(nx.t)}</div>`:'<div class=mu>Nothing left on today’s schedule.</div>'}</div>
<div class=grid><button class="b ${d.ow?'':'g'}" onclick="A.ow()">${d.ow?'Back to full day':'I’m overwhelmed'}</button><button class="b g" onclick="A.kids()">Children with me: ${d.kids?'Yes':'No'}</button></div>
<h2>Today’s intention</h2><input value="${esc(d.intent)}" placeholder="One intention for today" onchange="A.int(this.value)">
<div class=grid>${QA.map(q=>`<button class="b g" onclick="${q[1]}">${q[0]}</button>`).join('')}</div>
<h2>${d.ow?'Three essentials':'Today’s timeline'}</h2><div class=card style="padding:4px 14px">${d.ow?E.map((e,i)=>`<div class="row ${d.ed[i]?'done':''}"><button class=chk onclick="A.ei(${i})"></button><div class=t style="flex:1">${i?`<input value="${esc(d.ess[i])}" placeholder="${e}: choose one" onchange="A.es(${i},this.value)" style="margin:0">`:e}</div></div>`).join('')+'<p class=mu>Skip everything else without guilt.</p>':bl.length?bl.map(b=>`<div class="row ${d.done[b.id]?'done':''} ${nx&&nx.id==b.id?'now':''}"><button class=chk onclick="A.tg('${b.id}')" aria-label="Mark done"></button><div style="flex:1"><div class=mu>${t12(b.s)}–${t12(b.e)}${opt(b)?' · optional today':''}</div><span class=t>${esc(b.t)}</span></div></div>`).join(''):'<p class=mu>No blocks today. Add some in Schedule.</p>'}</div>`};
A.tg=id=>{const d=day();d.done[id]=!d.done[id];save();render()};A.ow=()=>{const d=day();d.ow=!d.ow;save();render()};A.kids=()=>{const d=day();d.kids=!d.kids;save();render()};A.int=v=>{day().intent=v;save()};A.ei=i=>{const d=day();d.ed[i]=d.ed[i]?0:1;save();render()};A.es=(i,v)=>{day().ess[i]=v;save()};

V.schedule=()=>{const o=[1,2,3,4,5,6,0],nn=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];return `<h1>Schedule</h1><div class=pills>${o.map((x,i)=>`<button class="${x==sd?'on':''}" onclick="sd=${x};render()">${nn[i]}</button>`).join('')}</div><div class=card style="padding:4px 14px">${blocks(sd).map(b=>`<div class=row onclick="A.eb('${b.id}')"><div style="flex:1"><div class=mu>${t12(b.s)}–${t12(b.e)}</div>${esc(b.t)}</div><span class=mu>Edit</span></div>`).join('')||'<p class=mu>No blocks yet.</p>'}</div><button class="b w" onclick="A.eb()">Add block</button><button class="b g w" style="margin-top:8px" onclick="A.rd()">Reset this day to default</button><p class=mu>Wake-up, bedtime and work hours are blocks. Edit them here and the whole app follows.</p>`};
A.eb=id=>{const b=id?S.sched[sd].find(x=>x.id==id):{s:'17:30',e:'18:00',t:''};op(()=>hd(id?'Edit block':'New block')+`<label>Start</label><input id=bs type=time value="${b.s}"><label>End</label><input id=be type=time value="${b.e}"><label>Activity</label><input id=bt value="${esc(b.t)}"><button class="b w" onclick="A.sb('${id||''}')">Save block</button>${id?`<button class="b g w" style="margin-top:8px" onclick="A.db('${id}')">Delete block</button>`:''}`)};
A.sb=id=>{const s=$('#bs').value,e=$('#be').value,t=$('#bt').value.trim();if(!s||!e||!t)return alert('Enter start, end and activity.');S.sched[sd]=S.sched[sd]||[];if(id){Object.assign(S.sched[sd].find(x=>x.id==id),{s,e,t})}else S.sched[sd].push({id:uid(),s,e,t});save();A.close()};A.db=id=>{if(confirm('Delete this block?')){S.sched[sd]=S.sched[sd].filter(x=>x.id!=id);save();A.close()}};A.rd=()=>{if(confirm('Reset this day’s schedule?')){S.sched[sd]=JSON.parse(JSON.stringify(SCHED[sd]));save();render()}};

const jl=()=>{const q=jq.toLowerCase(),L=S.journal.filter(j=>(!jf||j.type==jf)&&(!q||(JSON.stringify(j.f)+j.tags).toLowerCase().includes(q))).sort((a,b)=>b.ts-a.ts);return L.length?L.map(j=>{const p=Object.entries(j.f).map(x=>x[1]).find(v=>v&&isNaN(v))||'';return `<div class=card onclick="A.je('${j.id}')"><div class=sp><b>${TP[j.type].n}</b><span class=mu>${j.date}</span></div><div class=mu>${esc(p.slice(0,100))}${j.tags?' · #'+esc(j.tags):''}</div></div>`}).join(''):'<div class=card><span class=mu>No entries yet. Pick a type above and start writing.</span></div>'};
V.journal=()=>`<h1>Journal</h1><div class=grid><select id=nt style="margin:0">${Object.entries(TP).map(([k,v])=>`<option value=${k}>${v.n}</option>`).join('')}</select><button class="b" onclick="A.jn($('#nt').value)">New entry</button></div><h2>History</h2><input placeholder="Search" value="${esc(jq)}" oninput="jq=this.value;$('#jl').innerHTML=jl()"><select onchange="jf=this.value;$('#jl').innerHTML=jl()"><option value="">All types</option>${Object.entries(TP).map(([k,v])=>`<option value=${k} ${jf==k?'selected':''}>${v.n}</option>`).join('')}</select><div id=jl>${jl()}</div>`;
A.jn=t=>{ent={id:uid(),type:t,date:tod(),ts:Date.now(),f:{},tags:''};op(js)};A.je=id=>{ent=S.journal.find(x=>x.id==id);op(js)};
const js=()=>{const T=TP[ent.type];return hd(T.n)+`<div class=mu style="margin:-6px 0 12px">${ent.date} · saves automatically</div>`+T.f.map((f,i)=>f[1]=='i'?`<p class=mu>${f[0]}</p>`:`<label>${f[0]}</label>`+(f[1]=='n'?`<div class=sp><input id=f${i} type=range min=0 max=10 value="${ent.f[i]??0}" oninput="this.nextElementSibling.textContent=this.value;A.ji()"><b style="width:28px;text-align:right">${ent.f[i]??0}</b></div>`:f[1]=='s'?`<input id=f${i} value="${esc(ent.f[i])}" oninput="A.ji()">`:`<textarea id=f${i} oninput="A.ji()">${esc(ent.f[i])}</textarea>`)).join('')+`<label>Tags (optional)</label><input id=tg value="${esc(ent.tags)}" oninput="A.ji()"><button class="b g w" onclick="A.jd()">Delete entry</button>`};
A.ji=()=>{TP[ent.type].f.forEach((f,i)=>{const e=$('#f'+i);if(e)ent.f[i]=e.value});ent.tags=$('#tg').value;if(!S.journal.includes(ent)&&(ent.tags||TP[ent.type].f.some((f,i)=>f[1]!='n'&&f[1]!='i'&&(ent.f[i]||'').trim())))S.journal.push(ent);save()};A.jd=()=>{if(confirm('Delete this entry?')){S.journal=S.journal.filter(x=>x!==ent);save();A.close()}};

A.cr=()=>{let a=5;op(()=>hd('Craving support')+`<div class=card><label>1. How strong is the craving? (0–10)</label><div class=sp><input id=cva type=range min=0 max=10 value=5 oninput="this.nextElementSibling.textContent=this.value"><b>5</b></div><label>2. What triggered it?</label><input id=cvt placeholder="Trigger"></div><div class=card><b>Next steps</b><p>3. Move away from alcohol and access to alcohol.<br>4. Contact a trusted recovery person.<br>5. Consider attending a meeting.<br>6. Choose a safe activity: walk, shower, food, skate, music.</p>${S.contacts.map(c=>`<a class="b w" style="display:block;margin-bottom:8px;text-align:center;text-decoration:none" href="tel:${esc(c.p)}">Call ${esc(c.n)}</a>`).join('')||'<p class=mu>Add support contacts in Library.</p>'}</div><div class=card><label>7. Craving now (0–10)</label><div class=sp><input id=cvb type=range min=0 max=10 value=5 oninput="this.nextElementSibling.textContent=this.value"><b>5</b></div><button class="b w" onclick="A.sc()">Save to journal</button></div>${CR}<p class=mu>A hard day is not a failed day.</p>`)};
A.sc=()=>{S.journal.push({id:uid(),type:'craving',date:tod(),ts:Date.now(),tags:'',f:{0:$('#cvt').value,3:$('#cva').value,7:$('#cvb').value}});save();A.close()};

A.add=t=>op(()=>hd('Add activity')+`<label>Type</label><select id=ty>${Object.entries(LT).map(([k,v])=>`<option value=${k} ${k==t?'selected':''}>${v}</option>`).join('')}</select><label>Date</label><input id=ad type=date value="${tod()}"><label>Note (optional)</label><input id=an placeholder="AA/EA, how it felt, what you did"><button class="b w" onclick="A.sa()">Save</button>`);
A.sa=()=>{S.logs.push({id:uid(),type:$('#ty').value,date:$('#ad').value||tod(),note:$('#an').value});save();A.close()};

const hist=ex=>S.wk.filter(x=>x.ex===ex).sort((a,b)=>a.date<b.date?1:-1);
A.wo=()=>{wtpl=wtpl||({1:'Upper A',2:'Lower A',4:'Upper B',5:'Lower B'})[new Date().getDay()]||'Upper A';op(ws)};
const ws=()=>hd('Workout')+`<select onchange="wtpl=this.value;rs()">${Object.keys(S.tpl).map(k=>`<option ${k==wtpl?'selected':''}>${k}</option>`).join('')}</select><p class=mu>Work between RPE 6 and 9. No max-effort singles. Add weight only when every set feels RPE 8 or lower.</p>`+S.tpl[wtpl].map((e,i)=>{const h=hist(e),l=h[0],pr=h.length?Math.max(...h.map(x=>+x.wt||0)):0;return `<div class=card id=wc${i}><div class=sp><b>${esc(e)}</b><span class=mu onclick="A.rx(${i})">Remove</span></div><div class=mu>${l?`Last: ${l.sets}×${l.reps} @ ${l.wt} ${'lb'} (RPE ${l.rpe||'–'}) · Best: ${pr}`:'No history yet'}</div><div class=grid style="margin-top:8px"><div><label>Sets</label><input id=w${i}s type=number inputmode=numeric value="${l?l.sets:3}"></div><div><label>Reps</label><input id=w${i}r type=number inputmode=numeric value="${l?l.reps:8}"></div><div><label>Weight (lb)</label><input id=w${i}w type=number inputmode=decimal value="${l?l.wt:''}"></div><div><label>RPE</label><input id=w${i}e type=number inputmode=decimal min=1 max=10 value="${l?l.rpe:''}"></div></div><input id=w${i}n placeholder="Notes"><button class="b w" onclick="A.ws(${i})">Save exercise</button><div class="mu st"></div></div>`}).join('')+`<button class="b g w" onclick="A.ax()">Add exercise to ${wtpl}</button><h2>Recent history</h2>${S.wk.slice(-10).reverse().map(x=>`<div class=row><div style="flex:1"><b>${esc(x.ex)}</b><div class=mu>${x.date} · ${x.sets}×${x.reps} @ ${x.wt} lb · RPE ${x.rpe||'–'}</div></div></div>`).join('')||'<p class=mu>Nothing logged yet.</p>'}`;
A.ws=i=>{const g=k=>$(`#w${i}${k}`).value;if(!g('w')&&!confirm('Save without a weight (bodyweight)?'))return;S.wk.push({id:uid(),date:tod(),ex:S.tpl[wtpl][i],sets:g('s'),reps:g('r'),wt:g('w')||0,rpe:g('e'),note:g('n')});save();$(`#wc${i} .st`).textContent='Saved for '+tod()};A.rx=i=>{if(confirm('Remove from template?')){S.tpl[wtpl].splice(i,1);save();rs()}};A.ax=()=>{const n=prompt('Exercise name');if(n){S.tpl[wtpl].push(n);save();rs()}};

A.fd=()=>op(fs);
const fs=()=>{const d=day(),w=S.wts.slice().sort((a,b)=>a.date<b.date?1:-1);return hd('Food and body')+`<p class=mu>Every number here is what you enter. Nothing is estimated for you.</p><div class=card style="padding:4px 14px">${MEALS.map((m,i)=>`<div class="row ${d.meals[i]?'done':''}"><button class=chk onclick="A.ml(${i})"></button><div style="flex:1"><b class=t>${m[0]}</b><div class=mu>${m[1]}</div></div></div>`).join('')}</div>
<label>Protein today (g, you enter) · target ${S.set.pmin}–${S.set.pmax}</label><input type=number inputmode=numeric value="${d.prot||''}" onchange="day().prot=+this.value;save()">
<label>Calories today (optional, you enter)</label><input type=number inputmode=numeric value="${d.kcal||''}" onchange="day().kcal=+this.value;save()">
<div class=sp class=card><b>Water: ${d.water} / ${S.set.water}</b><span><button class="b g" onclick="A.wa(-1)">−</button> <button class="b" onclick="A.wa(1)">+</button></span></div>
<h2>Weigh-in</h2><div class=grid><input id=wi type=number inputmode=decimal placeholder="${S.set.wt} lb" style="margin:0"><button class=b onclick="A.wi()">Save weight</button></div>${w.slice(0,6).map(x=>`<div class=row><div style="flex:1">${x.date}</div><b>${x.w} lb</b></div>`).join('')}
<h2>Grocery list and prep</h2><textarea onchange="S.grocery=this.value;save()" placeholder="One item per line">${esc(S.grocery)}</textarea>`};
A.ml=i=>{const d=day();d.meals[i]=!d.meals[i];save();rs()};A.wa=n=>{const d=day();d.water=Math.max(0,d.water+n);save();rs()};A.wi=()=>{const v=+$('#wi').value;if(!v)return;S.wts=S.wts.filter(x=>x.date!=tod());S.wts.push({date:tod(),w:v});save();rs()};

V.progress=()=>{const w=mon(tod()),L=t=>S.logs.filter(x=>x.type==t&&x.date>=w).length,J=t=>S.journal.filter(j=>j.date>=w&&(!t||j.type==t)).length;
const R=[['Workouts',new Set(S.wk.filter(x=>x.date>=w).map(x=>x.date)).size,4],['Spanish sessions',L('spanish'),5],['Music sessions',L('music'),2],['Skateboarding',L('skate')],['Recovery meetings',L('meeting')],['Journal entries',J()],['Emotional check-ins',J('morning')],['Family activities',L('family')],['Business sessions',L('biz'),1],['Investing education',L('invest'),1]];
const dd=Object.entries(S.days).filter(([k,v])=>k>=w),pr=dd.filter(x=>x[1].prot>0),ml=dd.filter(x=>Object.values(x[1].meals).some(Boolean)),g={};S.wts.forEach(x=>(g[mon(x.date)]=g[mon(x.date)]||[]).push(x.w));const wa=Object.keys(g).sort().reverse().slice(0,5).map(k=>[k,avg(g[k])]);
const wn=Math.floor((pd(tod())-pd(S.set.start))/6048e5)+1,ph=wn<5?0:wn<9?1:2,PH=['Weeks 1–4: Establish routines, gym membership, recovery practices, meal prep and the Spanish habit.','Weeks 5–8: Improve physical performance, keep creating music, validate a business idea, build financial knowledge.','Weeks 9–13: Evaluate progress, develop music projects, launch a validated business if ready, set a steady savings and investing plan.'];
return `<h1>Progress</h1><h2>This week (since Monday)</h2><div class=card>${R.map(r=>`<div style="margin-bottom:12px"><div class=sp><span>${r[0]}</span><b>${r[1]}${r[2]?' / '+r[2]:''}</b></div>${r[2]?`<div class=bar><i style="width:${Math.min(100,r[1]/r[2]*100)}%"></i></div>`:''}</div>`).join('')}<div class=mu>Counts reflect what you logged. Weeks reset with no penalty.</div></div>
<h2>Nutrition</h2><div class=card>${pr.length?`Average protein on logged days: <b>${Math.round(avg(pr.map(x=>x[1].prot)))} g</b> (target ${S.set.pmin}–${S.set.pmax})`:'No protein logged this week.'}<br>${ml.length?`Meals checked: <b>${Math.round(avg(ml.map(x=>Object.values(x[1].meals).filter(Boolean).length)))} of 5</b> per logged day`:'No meals checked yet.'}</div>
<h2>Weekly average weight</h2><div class=card>${wa.length?wa.map((x,i)=>`<div class=sp><span>Week of ${x[0]}</span><b>${x[1].toFixed(1)} lb${wa[i+1]?` (${x[1]-wa[i+1][1]>=0?'+':''}${(x[1]-wa[i+1][1]).toFixed(1)})`:''}</b></div>`).join('')+'<div class=mu style="margin-top:8px">Goal: +0.25 to +0.5 lb per week.</div>':'No weigh-ins yet. Log them in Food.'}</div>
<h2>90-day roadmap</h2><div class=card><b>${wn<1?'Starts '+S.set.start:wn>13?'Past week 13':'Week '+wn+' of 13'}</b></div>${PH.map((p,i)=>`<div class=card style="${i==ph&&wn>=1&&wn<=13?'border:1px solid var(--ac)':'opacity:.7'}">${p}</div>`).join('')}<button class="b w" onclick="A.jn('weekly')">Write weekly review</button>`};

A.cs=()=>{const n=prompt('Contact name');if(!n)return;const p=prompt('Phone number');if(p){S.contacts.push({n,p});save();render()}};A.cd=i=>{S.contacts.splice(i,1);save();render()};
A.st=(k,v)=>{S.set[k]=['name','start'].includes(k)?v:+v;save();render()};
const dl=(n,t,m)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()};
A.ex=()=>dl('dayframe-backup-'+tod()+'.json',JSON.stringify(S,null,1),'application/json');
A.jx=()=>dl('dayframe-journal-'+tod()+'.md',S.journal.slice().sort((a,b)=>a.ts-b.ts).map(j=>`## ${j.date} · ${TP[j.type].n}\n`+TP[j.type].f.map((f,i)=>j.f[i]?`**${f[0]}**\n${j.f[i]}\n`:'').join('\n')+(j.tags?'\nTags: '+j.tags+'\n':'')).join('\n---\n\n')||'No entries.','text/markdown');
A.imp=el=>{const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.set||!o.sched)throw 0;if(!confirm('Replace all data on this device with the backup?'))return;S=Object.assign(DEF(),o);save();render();alert('Import complete.')}catch(e){alert('That file is not a DAYFRAME backup.')}};r.readAsText(f)};
A.clr=()=>{if(confirm('Delete ALL DAYFRAME data on this device? This cannot be undone.')&&confirm('Really delete everything?')){localStorage.removeItem(K);S=DEF();render()}};
const ref=(t,b)=>`<details class=card><summary>${t}</summary><div class=mu style="font-size:15px">${b}</div></details>`;
V.library=()=>`<h1>Library</h1>${CR}
${ref('Weekly schedule',[1,2,3,4,5,6,0].map((x,i)=>'<b>'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]+'</b>: '+blocks(x).filter(b=>b.s>='05:00'&&b.s<'21:00'&&!/Shower|Close laptop|Dinner|Prepare|Remote/.test(b.t)).map(b=>esc(b.t)).join('; ')).join('<br>'))}
${ref('Workout program',Object.entries(S.tpl).map(([k,v])=>`<b>${esc(k)}</b>: ${v.map(esc).join(', ')}`).join('<br>')+'<br>Wed, Sat, Sun: recovery or recreation. Skateboarding counts as activity.')}
${ref('Nutrition targets',`${S.set.pmin}–${S.set.pmax} g protein daily. About 250–350 calories above your maintenance. Gain 0.25–0.5 lb per week. Three meals and two snacks.`)}
${ref('Recovery plan','Daily check-in and sobriety commitment. Meetings: Mon and Wed, optional Fri and Sun. Use Log craving whenever one hits. Keep support contacts below. Not a substitute for a sponsor, therapist or clinician.')}
${ref('Spanish plan','15–20 minutes daily, five weekday sessions, 100-day goal. Focus on practical conversation. Log each session with Add activity.')}
${ref('Business roadmap','Stages: Idea, Research, Validation, Development, Launch, Review. One research block per week. Use Business notes in Journal.')}
${ref('Investing curriculum','Emergency savings first. Then compound growth, index funds, ETFs, diversification, asset allocation, risk tolerance, retirement accounts, budgeting, financial independence. One session per week. Educational only; no returns are guaranteed.')}
${ref('90-day goals','Balanced progress in physical health, emotional recovery, sobriety, fatherhood, music, Spanish, business and financial education.')}
<h2>Support contacts</h2>${S.contacts.map((c,i)=>`<div class=row><a style="flex:1" href="tel:${esc(c.p)}">${esc(c.n)} · ${esc(c.p)}</a><span class=mu onclick="A.cd(${i})">Remove</span></div>`).join('')}<button class="b g w" onclick="A.cs()">Add contact</button>
<h2>Settings</h2><div class=card><label>App name</label><input value="${esc(S.set.name)}" onchange="A.st('name',this.value)"><label>Body weight (lb)</label><input type=number value="${S.set.wt}" onchange="A.st('wt',this.value)"><label>Protein target min / max (g)</label><div class=grid><input type=number value="${S.set.pmin}" onchange="A.st('pmin',this.value)"><input type=number value="${S.set.pmax}" onchange="A.st('pmax',this.value)"></div><label>Water goal (cups)</label><input type=number value="${S.set.water}" onchange="A.st('water',this.value)"><label>90-day start date</label><input type=date value="${S.set.start}" onchange="A.st('start',this.value)"><p class=mu>Wake-up, bedtime, work hours and training days: edit the blocks in Schedule. DAYFRAME has no server, so it cannot send background notifications. Use iPhone Clock or Reminders for alarms.</p></div>
<h2>Your data stays on this device</h2><div class=grid><button class="b g" onclick="A.ex()">Export all (JSON)</button><button class="b g" onclick="A.jx()">Export journal (MD)</button></div><label style="display:block;margin-top:10px">Import backup</label><input type=file accept=".json,application/json" onchange="A.imp(this)"><button class="b g w" onclick="A.clr()">Clear all data</button>
<h2>Install on iPhone</h2><div class=card>1. Open this page in Safari.<br>2. Tap Share.<br>3. Choose Add to Home Screen.<br>4. Confirm the name.<br>5. Launch DAYFRAME from the Home Screen.</div>`;
render();setInterval(()=>{if(!cur&&tab=='today'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName))render()},6e4);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
